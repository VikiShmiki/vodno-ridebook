[project]
name = "vodno-ridebook-backend"
version = "1.0.0"
description = "FastAPI backend for Vodno Ridebook"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
# Depends()/Query() in argument defaults is the documented FastAPI idiom.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
