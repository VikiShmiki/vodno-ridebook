# Headless Service (clusterIP: None). It gives the StatefulSet pod the stable
# DNS name postgres-0.postgres.vodno-ridebook.svc.cluster.local, while the
# short name `postgres` is what the backend connects to.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: vodno-ridebook
  labels:
    app: postgres
    app.kubernetes.io/part-of: vodno-ridebook
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
