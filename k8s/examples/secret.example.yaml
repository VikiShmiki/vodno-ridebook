# Template only - this file contains no real credentials and is NOT applied by
# `kubectl apply -f k8s/`, because kubectl does not recurse into subdirectories.
#
# Create the real Secret before the first deployment, either by copying this
# file and editing it:
#
#   cp k8s/examples/secret.example.yaml k8s/secret.yaml
#   $EDITOR k8s/secret.yaml          # k8s/secret.yaml is git-ignored
#
# or, preferably, by generating it imperatively so no credential is ever
# written to disk inside the repository:
#
#   kubectl -n vodno-ridebook create secret generic vodno-secret \
#     --from-literal=POSTGRES_USER=vodno \
#     --from-literal=POSTGRES_PASSWORD="$(openssl rand -base64 24)"

apiVersion: v1
kind: Secret
metadata:
  name: vodno-secret
  namespace: vodno-ridebook
  labels:
    app.kubernetes.io/part-of: vodno-ridebook
type: Opaque
# stringData takes plain text and is base64-encoded by the API server.
stringData:
  POSTGRES_USER: "vodno"
  POSTGRES_PASSWORD: "REPLACE_WITH_A_REAL_PASSWORD"
