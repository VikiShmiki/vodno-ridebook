# PostgreSQL runs as a StatefulSet, not a Deployment, because it owns state:
# it needs a stable network identity (postgres-0.postgres) and a PersistentVolume
# that is re-attached to the same pod after every restart or reschedule.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: vodno-ridebook
  labels:
    app: postgres
    app.kubernetes.io/part-of: vodno-ridebook
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        app.kubernetes.io/part-of: vodno-ridebook
    spec:
      securityContext:
        # UID/GID of the postgres user inside the official image. fsGroup makes
        # the mounted volume group-writable for it.
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: vodno-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: vodno-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vodno-secret
                  key: POSTGRES_PASSWORD
            # The volume is mounted at /var/lib/postgresql/data, so the cluster
            # itself is initialised one directory deeper.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 800m
              memory: 512Mi
  # One PersistentVolumeClaim is created per replica and deliberately survives
  # deletion of the StatefulSet's pods, which is what keeps the data.
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/part-of: vodno-ridebook
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
