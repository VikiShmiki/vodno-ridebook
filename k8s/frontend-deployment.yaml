apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: vodno-ridebook
  labels:
    app: frontend
    app.kubernetes.io/part-of: vodno-ridebook
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: frontend
        app.kubernetes.io/part-of: vodno-ridebook
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: frontend
      securityContext:
        runAsNonRoot: true
        # UID of the nginx user in the nginx-unprivileged base image.
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: ghcr.io/vikishmiki/vodno-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: BACKEND_URL
              valueFrom:
                configMapKeyRef:
                  name: vodno-config
                  key: BACKEND_URL
          # /healthz is served by nginx itself and does not depend on the API,
          # so a backend outage never restarts the frontend pods.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
          # Endpoint removal and SIGTERM are delivered concurrently. Pausing
          # before the server starts shutting down lets kube-proxy and the
          # Ingress controller drop this pod from their backend lists first,
          # so no in-flight request is lost during a rolling update.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # The nginx entrypoint renders /etc/nginx/templates into conf.d and
            # nginx needs writable cache/run/tmp paths, so each is an emptyDir
            # on top of the read-only root filesystem.
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /tmp
      volumes:
        - name: nginx-conf
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
      terminationGracePeriodSeconds: 30
