# Continuous delivery.
#
# On every push to main the CI workflow is re-run, both images are published
# to the GitHub Container Registry, and - when a KUBE_CONFIG secret is
# configured - the running Kubernetes Deployments are rolled to the new tag.

name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  # Exactly the same lint/test/build gate that pull requests go through.
  tests:
    name: CI gate
    uses: ./.github/workflows/ci.yml

  publish:
    name: Build and push images
    runs-on: ubuntu-latest
    needs: tests
    outputs:
      image_tag: ${{ steps.meta.outputs.short_sha }}
      has_kubeconfig: ${{ steps.kube.outputs.configured }}
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive image coordinates
        id: meta
        run: |
          # GHCR only accepts lowercase repository names.
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${owner}/vodno-${{ matrix.service }}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Provided automatically by GitHub Actions; never hardcoded.
          password: ${{ secrets.GITHUB_TOKEN }}

      # Readable tags plus the immutable commit SHA, so any running pod can be
      # traced back to the exact commit it was built from.
      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.short_sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.short_sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Summarise published tags
        run: |
          {
            echo "### Published \`${{ matrix.service }}\`"
            echo ''
            echo '- `${{ steps.meta.outputs.image }}:latest`'
            echo '- `${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.short_sha }}`'
            echo '- `${{ steps.meta.outputs.image }}:${{ github.sha }}`'
          } >> "$GITHUB_STEP_SUMMARY"

      # The secrets context is not available in a job-level `if`, so the
      # presence of a kubeconfig is turned into a job output here instead.
      - name: Detect whether a cluster is configured
        id: kube
        run: echo "configured=${{ secrets.KUBE_CONFIG != '' }}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Roll out to Kubernetes
    runs-on: ubuntu-latest
    needs: publish
    if: needs.publish.outputs.has_kubeconfig == 'true'
    env:
      NAMESPACE: vodno-ridebook
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure kubectl
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          kubectl version --client
          kubectl cluster-info

      - name: Apply manifests
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/ -n "$NAMESPACE"

      # `kubectl set image` triggers the rolling update; the Deployment's
      # RollingUpdate strategy keeps the service available throughout.
      - name: Roll out the new image tag
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          tag="${{ needs.publish.outputs.image_tag }}"

          kubectl -n "$NAMESPACE" set image deployment/backend \
            backend="ghcr.io/${owner}/vodno-backend:${tag}"
          kubectl -n "$NAMESPACE" set image deployment/frontend \
            frontend="ghcr.io/${owner}/vodno-frontend:${tag}"

      - name: Wait for both rollouts to finish
        run: |
          kubectl -n "$NAMESPACE" rollout status deployment/backend --timeout=180s
          kubectl -n "$NAMESPACE" rollout status deployment/frontend --timeout=180s

      - name: Report cluster state
        if: always()
        run: |
          {
            echo '### Cluster state after deployment'
            echo ''
            echo '```'
            kubectl get pods,svc,ingress -n "$NAMESPACE" 2>&1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
