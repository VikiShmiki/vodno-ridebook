# Continuous delivery.
#
# On every push to main the CI workflow is re-run, both images are published
# to the GitHub Container Registry, and - when SELF_HOSTED_DEPLOY is true - a
# runner next to the cluster rolls the Kubernetes Deployments to the new tag.

name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  # ci.yml is re-used via workflow_call and inherits these permissions, so the
  # Trivy SARIF upload in the CI gate needs the grant here too.
  security-events: write

jobs:
  # Exactly the same lint/test/build gate that pull requests go through.
  tests:
    name: CI gate
    uses: ./.github/workflows/ci.yml

  publish:
    name: Build and push images
    runs-on: ubuntu-24.04
    needs: tests
    outputs:
      image_tag: ${{ steps.meta.outputs.short_sha }}
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Derive image coordinates
        id: meta
        run: |
          # GHCR only accepts lowercase repository names.
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${owner}/vodno-${{ matrix.service }}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Provided automatically by GitHub Actions; never hardcoded.
          password: ${{ secrets.GITHUB_TOKEN }}

      # Readable tags plus the immutable commit SHA, so any running pod can be
      # traced back to the exact commit it was built from.
      - name: Build and push ${{ matrix.service }}
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.short_sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.short_sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # Scan the exact immutable registry digest that was just published. The
      # CI gate scans a local image too, but a second build could otherwise
      # resolve a different mutable base image between CI and publication.
      - name: Scan published ${{ matrix.service }} digest
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

      - name: Generate published image SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}
          scan-type: image
          format: cyclonedx
          output: published-sbom-${{ matrix.service }}.json

      - name: Upload published image SBOM
        uses: actions/upload-artifact@v7
        with:
          name: published-sbom-${{ matrix.service }}
          path: published-sbom-${{ matrix.service }}.json
          retention-days: 30

      - name: Summarise published tags
        run: |
          {
            echo "### Published \`${{ matrix.service }}\`"
            echo ''
            echo '- `${{ steps.meta.outputs.image }}:latest`'
            echo '- `${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.short_sha }}`'
            echo '- `${{ steps.meta.outputs.image }}:${{ github.sha }}`'
          } >> "$GITHUB_STEP_SUMMARY"


  deploy:
    name: Roll out to Kubernetes
    # Runs on a self-hosted runner that sits next to the cluster, because a
    # GitHub-hosted runner cannot reach a local kind cluster. Only this job is
    # self-hosted, and it only triggers on a push to main - never on a pull
    # request, which is what keeps untrusted fork code off the machine.
    runs-on: [self-hosted, vodno-kind]
    needs: publish
    # A repository variable rather than a secret: when the runner is offline,
    # unset it and the job is skipped instead of queueing forever.
    if: vars.SELF_HOSTED_DEPLOY == 'true'
    env:
      NAMESPACE: vodno-ridebook
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show cluster
        run: |
          kubectl version --client
          kubectl cluster-info
          kubectl get nodes

      - name: Record the currently running images for rollback
        id: current
        run: |
          backend=$(kubectl -n "$NAMESPACE" get deploy backend -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || true)
          frontend=$(kubectl -n "$NAMESPACE" get deploy frontend -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || true)
          echo "backend=${backend}" >> "$GITHUB_OUTPUT"
          echo "frontend=${frontend}" >> "$GITHUB_OUTPUT"

      # Render the immutable full commit SHA into the checked-out manifests
      # before applying them. This creates one rollout and ensures `apply`
      # cannot temporarily reset a Deployment to the mutable `latest` tag.
      - name: Render immutable image tags
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          sed -i "s|ghcr.io/vikishmiki/vodno-backend:latest|ghcr.io/${owner}/vodno-backend:${GITHUB_SHA}|" k8s/backend-deployment.yaml
          sed -i "s|ghcr.io/vikishmiki/vodno-frontend:latest|ghcr.io/${owner}/vodno-frontend:${GITHUB_SHA}|" k8s/frontend-deployment.yaml

      - name: Apply manifests and start the rollout
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/

      - name: Wait for both rollouts
        run: |
          kubectl -n "$NAMESPACE" rollout status deployment/backend  --timeout=300s
          kubectl -n "$NAMESPACE" rollout status deployment/frontend --timeout=300s

      # A green rollout only means the pods started. This checks the
      # application actually answers through the Ingress.
      - name: Smoke test through the Ingress
        run: |
          for attempt in $(seq 1 20); do
            if curl -fsS -m 5 -H 'Host: vodno.local' http://127.0.0.1/api/health \
                 | tee /dev/stderr | grep -q '"status":"healthy"'; then
              curl -fsS -m 5 -o /dev/null -H 'Host: vodno.local' http://127.0.0.1/
              echo "Smoke test passed after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 3
          done
          echo "Smoke test never passed"
          exit 1

      # If the new version is live but broken, put the previous one back
      # rather than leaving the cluster in a bad state.
      - name: Roll back on failure
        if: failure()
        env:
          PREVIOUS_BACKEND: ${{ steps.current.outputs.backend }}
          PREVIOUS_FRONTEND: ${{ steps.current.outputs.frontend }}
        run: |
          echo "Deployment failed - restoring the previous images"
          if [[ -n "$PREVIOUS_BACKEND" && -n "$PREVIOUS_FRONTEND" ]]; then
            kubectl -n "$NAMESPACE" set image deployment/backend  "backend=${PREVIOUS_BACKEND}"  || true
            kubectl -n "$NAMESPACE" set image deployment/frontend "frontend=${PREVIOUS_FRONTEND}" || true
            kubectl -n "$NAMESPACE" rollout status deployment/backend  --timeout=180s || true
            kubectl -n "$NAMESPACE" rollout status deployment/frontend --timeout=180s || true
          else
            echo "No previous Deployments existed; there is no prior revision to restore"
          fi

      - name: Report cluster state
        if: always()
        run: |
          {
            echo '### Cluster state after deployment'
            echo ''
            echo '```'
            kubectl get pods,svc,ingress -n "$NAMESPACE" 2>&1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
