# Continuous integration.
#
# Runs on every pull request and on every push to a branch other than main.
# It is also callable from cd.yml so that main is never published without the
# exact same checks having passed first.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend lint, test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc -b

      - name: Unit tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  backend:
    name: Backend lint and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # The suite runs against a real PostgreSQL instance, the same major
    # version that Docker Compose and the Kubernetes StatefulSet use.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vodno_test
          POSTGRES_USER: vodno
          POSTGRES_PASSWORD: vodno
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vodno -d vodno_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Check formatting (ruff)
        run: ruff format --check .

      - name: Run tests against PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg://vodno:vodno@localhost:5432/vodno_test
        run: pytest -v

      - name: Validate the application imports and exposes its OpenAPI schema
        env:
          DATABASE_URL: postgresql+psycopg://vodno:vodno@localhost:5432/vodno_test
        run: |
          python - <<'PY'
          from app.main import app

          schema = app.openapi()
          paths = sorted(schema["paths"])
          print("\n".join(paths))

          required = {
              "/api/health",
              "/api/rides",
              "/api/reports",
              "/api/motorcycles",
              "/api/stats",
          }
          missing = required - set(paths)
          assert not missing, f"Missing API routes: {missing}"
          PY

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Verify the image builds on a pull request without publishing anything.
      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: false
          load: true
          tags: vodno-${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Show image size
        run: docker image ls vodno-${{ matrix.service }}:ci

  compose-smoke-test:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start the full stack
        run: |
          cp .env.example .env
          docker compose up --build -d

      - name: Wait for the frontend to become healthy
        run: |
          for attempt in $(seq 1 40); do
            if curl -fsS http://localhost:8080/healthz > /dev/null; then
              echo "Frontend is serving after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 3
          done
          echo "Frontend never became healthy"
          docker compose ps
          docker compose logs
          exit 1

      - name: Check the API through the nginx proxy
        run: |
          curl -fsS http://localhost:8080/api/health | tee /dev/stderr | grep -q '"status":"healthy"'
          curl -fsS http://localhost:8080/api/stats  > /dev/null
          curl -fsS http://localhost:8080/api/reports > /dev/null

      - name: Tear down
        if: always()
        run: docker compose down -v
